<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eSIM-A-THON · Team Name Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb; --panel:#ffffff; --ink:#0d1b3a; --muted:#51607d; --line:#c9d5ea;
  --cyan:#0a8fb8; --amber:#b86f00; --chip:#e3ecfa; --taken:#e7ebf2;
  --danger:#b3261e; --ok:#1c7c4a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#070f24; --panel:#0e1b3b; --ink:#eaf2ff; --muted:#9fb1d4; --line:#1f3263;
    --cyan:#36d6ff; --amber:#ffb627; --chip:#15275a; --taken:#0b1530; --danger:#ff7a70; --ok:#5fe0a0;
  }
}
:root[data-theme="dark"]{
  --bg:#070f24; --panel:#0e1b3b; --ink:#eaf2ff; --muted:#9fb1d4; --line:#1f3263;
  --cyan:#36d6ff; --amber:#ffb627; --chip:#15275a; --taken:#0b1530; --danger:#ff7a70; --ok:#5fe0a0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}
h1{font-family:"Chakra Petch","Trebuchet MS",sans-serif;font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:0}
h1 .a{color:var(--cyan)} h1 .b{color:var(--amber)}
.sub{margin:8px 0 0;color:var(--muted);font-size:17px}
.meters{display:flex;gap:26px;text-align:right}
.meter .num{font-family:"Chakra Petch",sans-serif;font-size:40px;font-weight:700;line-height:1;color:var(--amber)}
.meter .lbl{color:var(--muted);font-size:14px}
h2{font-family:"Chakra Petch",sans-serif;font-size:22px;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:"Barlow",sans-serif;font-weight:500;font-size:15px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%}
input,select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:5;max-height:340px;overflow:auto;display:none}
.results.on{display:block}
.res{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;cursor:pointer}
.res:last-child{border-bottom:none}
.res:hover,.res:focus-visible{background:var(--chip);outline:none}
.res[disabled]{cursor:not-allowed;opacity:.55}
.res .meta{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:40px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:6px 8px 6px 14px;font-weight:600}
.chip small{font-weight:400;color:var(--muted)}
.chip button{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.hint{color:var(--muted);font-size:14px}
button{font:inherit;cursor:pointer}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04121f}
.btn.warn{color:var(--danger);border-color:var(--danger);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,.chip button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.grid.locked .card{opacity:.45}
.card{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--cyan);font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(22px,3.6vw,32px);transition:border-color .15s,transform .15s,color .15s}
.grid:not(.locked) .card:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-2px)}
.card.leaving{animation:out .45s forwards}
@keyframes out{to{opacity:0;transform:scale(.8)}}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tm{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--taken);border:1px solid var(--line)}
.tm .n{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:22px;color:var(--cyan);min-width:34px}
.tm .nm{font-weight:700;font-size:17px}
.tm .mem{color:var(--muted);font-size:14px}
.tm .rel{margin-left:auto;align-self:flex-start;border:none;background:none;color:var(--danger);font-size:13px;text-decoration:underline;padding:2px}
.empty{color:var(--muted);padding:10px 0}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;align-items:center}
.note{color:var(--muted);font-size:14px;flex:1;min-width:220px}
.overlay{position:fixed;inset:0;background:rgba(3,8,22,.62);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.overlay.on{display:flex}
.modal{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:26px;width:min(460px,100%)}
.modal .big{font-family:"Chakra Petch",sans-serif;font-size:54px;font-weight:700;line-height:1;margin:4px 0 12px;color:var(--cyan)}
.reveal{font-family:"Chakra Petch",sans-serif;font-size:clamp(30px,7vw,46px);font-weight:700;line-height:1.1;color:var(--amber);margin:10px 0 8px;animation:pop .6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.card,.card.leaving,.reveal{animation:none;transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="a">eSIM</span>-A-<span class="b">THON</span></h1>
      <p class="sub">Add your team members, pick a number, and reveal your team name.</p>
    </div>
    <div class="meters">
      <div class="meter"><div class="num" id="left">60</div><div class="lbl">numbers left</div></div>
      <div class="meter"><div class="num" id="free">150</div><div class="lbl">participants without a team</div></div>
    </div>
  </header>

  <h2>1. Add team members <small id="sizeHint"></small></h2>
  <div class="panel">
    <div class="tools">
      <div class="search">
        <input id="q" type="search" autocomplete="off" placeholder="Search by name, register number or pass code" aria-label="Search participants">
        <div class="results" id="results" role="listbox"></div>
      </div>
      <select id="slot" aria-label="Slot"><option value="">All slots</option><option value="1">Slot 1</option><option value="2">Slot 2</option></select>
      <select id="max" aria-label="Maximum team size"><option value="1">Max 1 per team</option><option value="2">Max 2 per team</option><option value="3" selected>Max 3 per team</option><option value="4">Max 4 per team</option></select>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <h2>2. Pick a number <small id="pickHint">Add at least one member first.</small></h2>
  <div class="grid locked" id="grid"></div>
  <div class="empty" id="noneLeft" hidden>Every number has been picked.</div>

  <h2>Revealed teams <small id="teamCount"></small></h2>
  <div class="teams" id="teams"></div>
  <div class="empty" id="noneTeams">No teams yet.</div>

  <div class="foot">
    <p class="note" id="mode"></p>
    <button class="btn" id="csv">Download teams (CSV)</button>
    <button class="btn warn" id="reset" hidden>Reset all</button>
  </div>
</div>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-labelledby="mT">
  <div class="modal">
    <div class="hint" id="mT">You picked number</div>
    <div class="big" id="mNum"></div>
    <div class="hint">For</div>
    <div id="mMembers" style="font-weight:600;margin-top:2px"></div>
    <div class="err" id="err"></div>
    <div class="row">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn primary" id="confirm">Reveal team name</button>
    </div>
  </div>
</div>
<div class="overlay" id="rv" role="dialog" aria-modal="true" aria-labelledby="rvT">
  <div class="modal" style="text-align:center">
    <div class="hint" id="rvT" style="font-size:15px"></div>
    <div class="reveal" id="rvName"></div>
    <div class="hint" id="rvBy" style="font-size:15px"></div>
    <div class="row" style="justify-content:center;margin-top:20px"><button class="btn primary" id="rvOk">Next team</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

const BY_CODE={}; PEOPLE.forEach(p=>BY_CODE[p.c]=p);
const id=n=>"n"+String(n).padStart(2,"0");
const $=s=>document.getElementById(s);
const LS="esimathon-draw";
let claims={}, db=null, canAdmin=true, pending=null, team=[];

function loadLocal(){try{claims=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){claims={}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(claims))}catch(e){}}
function assigned(){const m={}; Object.values(claims).forEach(c=>(c.members||[]).forEach(code=>m[code]=c)); return m}
function toast(t){const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.h); toast.h=setTimeout(()=>e.classList.remove("on"),2600)}
function maxSize(){return +$("max").value}

function renderSearch(){
  const q=$("q").value.trim().toLowerCase(), box=$("results"); box.textContent="";
  if(q.length<2){box.classList.remove("on");return}
  const slot=$("slot").value, as=assigned();
  const hits=PEOPLE.filter(p=>(!slot||p.s===slot)&&(p.n.toLowerCase().includes(q)||p.r.includes(q)||p.c.toLowerCase().includes(q))).slice(0,10);
  if(!hits.length){const d=document.createElement("div"); d.className="res"; d.textContent="No participant matches that."; box.append(d)}
  hits.forEach(p=>{
    const b=document.createElement("button"); b.className="res"; b.type="button";
    const l=document.createElement("span"); l.textContent=p.n;
    const r=document.createElement("span"); r.className="meta";
    const inTeam=as[p.c], inDraft=team.includes(p.c);
    r.textContent= inTeam ? "Already in "+inTeam.name : inDraft ? "Added" : [p.r||p.c,p.d,p.k,"Slot "+p.s].filter(Boolean).join(" · ");
    if(inTeam||inDraft) b.disabled=true;
    b.onclick=()=>addMember(p.c);
    b.append(l,r); box.append(b);
  });
  box.classList.add("on");
}
function addMember(code){
  if(team.length>=maxSize()){toast("A team can have at most "+maxSize()+" members.");return}
  team.push(code); $("q").value=""; $("results").classList.remove("on"); renderTeam(); $("q").focus();
}
function renderTeam(){
  const c=$("chips"); c.textContent="";
  if(!team.length){const s=document.createElement("span"); s.className="hint"; s.textContent="No members added yet. Search above and tap a name."; c.append(s)}
  team.forEach(code=>{
    const p=BY_CODE[code]; const d=document.createElement("span"); d.className="chip";
    const t=document.createElement("span"); t.textContent=p.n+" "; const sm=document.createElement("small"); sm.textContent=p.r||p.c; t.append(sm);
    const x=document.createElement("button"); x.type="button"; x.textContent="×"; x.setAttribute("aria-label","Remove "+p.n);
    x.onclick=()=>{team=team.filter(k=>k!==code); renderTeam()};
    d.append(t,x); c.append(d);
  });
  $("sizeHint").textContent=team.length+" of "+maxSize()+" added";
  const ready=team.length>0;
  $("grid").classList.toggle("locked",!ready);
  $("pickHint").textContent= ready ? "Tap any number to reveal your team name." : "Add at least one member first.";
}
function render(){
  const grid=$("grid"); grid.textContent=""; let avail=0;
  NAMES.forEach((_,i)=>{const n=i+1; if(claims[id(n)]) return; avail++;
    const b=document.createElement("button"); b.className="card"; b.dataset.n=n; b.textContent=n; b.setAttribute("aria-label","Pick number "+n);
    b.onclick=()=>openModal(n); grid.append(b)});
  $("left").textContent=avail; $("noneLeft").hidden=avail!==0;
  const as=assigned(); $("free").textContent=PEOPLE.length-Object.keys(as).length;
  team=team.filter(c=>!as[c]);
  const list=Object.values(claims).sort((a,b)=>(b.at||0)-(a.at||0)), box=$("teams"); box.textContent="";
  list.forEach(c=>{
    const d=document.createElement("div"); d.className="tm";
    const a=document.createElement("span"); a.className="n"; a.textContent=c.n;
    const m=document.createElement("div");
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=c.name;
    const mem=document.createElement("div"); mem.className="mem"; mem.textContent=(c.members||[]).map(k=>BY_CODE[k]?BY_CODE[k].n:k).join(", ");
    m.append(nm,mem); d.append(a,m);
    if(canAdmin){const r=document.createElement("button"); r.className="rel"; r.textContent="Release"; r.onclick=()=>release(c.n); d.append(r)}
    box.append(d);
  });
  $("teamCount").textContent=list.length? list.length+" teams":"";
  $("noneTeams").hidden=list.length>0;
  $("reset").hidden=!(canAdmin&&list.length);
  renderTeam();
}
function openModal(n){
  if(!team.length){toast("Add your team members first."); $("q").focus(); return}
  if(claims[id(n)]){toast("That number was just picked.");return}
  pending=n; $("mNum").textContent=n;
  $("mMembers").textContent=team.map(k=>BY_CODE[k].n).join(", ");
  $("err").textContent=""; $("ov").classList.add("on"); setTimeout(()=>$("confirm").focus(),30);
}
function closeModal(){$("ov").classList.remove("on"); pending=null}
async function claim(){
  const n=pending; if(!n) return; const btn=$("confirm"); btn.disabled=true;
  const as=assigned(), clash=team.find(k=>as[k]);
  if(clash){$("err").textContent=BY_CODE[clash].n+" is already in "+as[clash].name+". Remove them first."; btn.disabled=false; return}
  const rec={n,name:NAMES[n-1],members:team.slice(),at:Date.now()};
  try{
    if(db){
      const ref=db.doc("claims/"+id(n));
      const lease=await ref.acquire({holder:"tab-"+Math.random().toString(36).slice(2),ttlMs:5000});
      if(!lease.acquired){$("err").textContent="Another team is picking this number right now. Choose a different one."; return}
      const snap=await ref.get();
      if(snap.exists&&snap.data()&&snap.data().name){$("err").textContent="This number was just picked by another team."; return}
      await ref.set(rec);
    }
    const card=document.querySelector('.card[data-n="'+n+'"]'); closeModal();
    const done=()=>{claims[id(n)]=rec; team=[]; if(!db) saveLocal(); render(); showReveal(rec)};
    if(card&&!matchMedia("(prefers-reduced-motion: reduce)").matches){card.classList.add("leaving"); setTimeout(done,420)} else done();
  }catch(e){$("err").textContent= e&&e.code==="invalid_argument"?"You don't have permission to pick numbers here.":"Couldn't save. Check the connection and try again."}
  finally{btn.disabled=false}
}
function showReveal(r){
  $("rvT").textContent="Number "+r.n+" is";
  const nm=$("rvName"); nm.textContent=r.name; nm.style.animation="none"; void nm.offsetWidth; nm.style.animation="";
  $("rvBy").textContent=r.members.map(k=>BY_CODE[k]?BY_CODE[k].n:k).join(", ");
  $("rv").classList.add("on"); setTimeout(()=>$("rvOk").focus(),30);
}
async function release(n){
  const c=claims[id(n)]; if(!c||!confirm("Release number "+n+" ("+c.name+")? Its members will be free to join another team.")) return;
  try{ if(db) await db.doc("claims/"+id(n)).delete(); delete claims[id(n)]; if(!db) saveLocal(); render(); toast("Number "+n+" is available again.")}
  catch(e){toast("Couldn't release. Try again.")}
}
async function resetAll(){
  if(!confirm("Release every team and number? This can't be undone.")) return;
  try{ if(db){for(const k of Object.keys(claims)) await db.doc("claims/"+k).delete()} claims={}; if(!db) saveLocal(); render(); toast("Everything is reset.")}
  catch(e){toast("Couldn't reset everything. Try again.")}
}
function buildCSV(){
  const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[["Number","Team Name","Member","Register Number","Pass Code","Department","College","Slot","Year"]];
  Object.values(claims).sort((a,b)=>a.n-b.n).forEach(c=>(c.members||[]).forEach(k=>{const p=BY_CODE[k]||{c:k};rows.push([c.n,c.name,p.n,p.r,p.c,p.d,p.k,p.s,p.y])}));
  const as=assigned(); PEOPLE.filter(p=>!as[p.c]).forEach(p=>rows.push(["","Not in a team",p.n,p.r,p.c,p.d,p.k,p.s,p.y]));
  return rows.map(r=>r.map(esc).join(",")).join("\r\n");
}
async function downloadCSV(){
  const data="\ufeff"+buildCSV(), filename="eSIM-A-THON_teams.csv";
  try{const dl=window.claude&&window.claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename,data});return}}catch(e){if(e&&e.code==="declined")return; toast("Couldn't save the file."); return}
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"})); a.download=filename; a.click();
}

$("q").addEventListener("input",renderSearch);
$("q").addEventListener("focus",renderSearch);
$("slot").onchange=renderSearch;
$("max").onchange=()=>{if(team.length>maxSize()) team=team.slice(0,maxSize()); renderTeam()};
document.addEventListener("click",e=>{if(!e.target.closest(".search")) $("results").classList.remove("on")});
$("cancel").onclick=closeModal; $("confirm").onclick=claim;
$("rvOk").onclick=()=>{$("rv").classList.remove("on"); $("q").focus()};
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();$("rv").classList.remove("on");$("results").classList.remove("on")}});
$("reset").onclick=resetAll; $("csv").onclick=downloadCSV;

loadLocal(); render(); $("mode").textContent="Saved on this device.";
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(u){try{canAdmin=!!(await u.canEdit())}catch(e){canAdmin=false}}
    if(!d){render();return}
    db=d; claims={}; render(); $("mode").textContent="Live: picks sync instantly on every screen that has this page open.";
    db.collection("claims").onSnapshot(s=>{const nx={}; s.docs.forEach(doc=>{const v=doc.data(); if(v&&v.name) nx[doc.id]=v}); claims=nx; render()},
      ()=>{$("mode").textContent="Live sync paused. Reload the page to reconnect."});
  }catch(e){}
})();
</script>
